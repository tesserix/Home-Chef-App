# fe3dr.com landing — static-export serving.
# Mirrors apps/web/nginx.conf security headers, adapted for a pure
# static site (no API/Otto proxies, no SPA fallback).

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Static marketing site CSP. 'unsafe-inline' is required for Next.js
    # inline styles + the JSON-LD script block; images.unsplash.com hosts
    # the placeholder photography (drop once owned photos ship).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.tesserix.app; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://analytics.tesserix.app; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # The pages are prerendered at build time, so the OpenPanel config the Helm
    # chart injects into the pod can only reach the browser from here — envsubst
    # fills these in at container start and the client fetches them on mount.
    location = /analytics-config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"clientId":"${OPENPANEL_CLIENT_ID}","apiUrl":"${OPENPANEL_API_URL}","scriptUrl":"${OPENPANEL_SCRIPT_URL}"}';
    }

    # iOS Universal Links association (#58) — the extensionless AASA file must be
    # served as application/json with no redirect for Apple to verify it.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # Hashed Next.js build assets — immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Hosted checkout. The marketing CSP below blocks sdk.cashfree.com outright,
    # so /pay/ rendered "Could not reach the payment provider" on every visit —
    # the SDK script was refused before it could load. Cashfree is allowed HERE
    # ONLY, so the rest of the site keeps script-src 'self'.
    #
    # frame-src and form-action carry the redirect/iframe the SDK opens for the
    # bank's own page; connect-src carries its API calls. Both hosts are listed
    # because the environment follows the credentials, not the deploy.
    location /pay/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.cashfree.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://*.cashfree.com; connect-src 'self' https://sdk.cashfree.com https://api.cashfree.com https://sandbox.cashfree.com https://*.cashfree.com; frame-src https://*.cashfree.com; form-action 'self' https://*.cashfree.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Pages — trailingSlash export means every route is a directory index.
    # HTML is never cached so deploys take effect immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.tesserix.app; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://analytics.tesserix.app; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Error pages — Next emits out/404.html
    error_page 404 /404.html;
}
