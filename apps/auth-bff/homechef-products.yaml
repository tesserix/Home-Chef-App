platformDomain: fe3dr.com

# Zitadel OIDC (project 388810586143588367, org TESSERIX, https://auth.tesserix.app).
# All web apps share the homechef-web public client (PKCE, no secret) — the
# clientId below is a local-dev placeholder; prod values come from the copy in
# tesserix-k8s/charts/apps/homechef-auth-bff once the ZitadelApplication claim
# reconciles and reports status.clientId.
#
# Mobile auth does NOT use these app entries (it goes through /auth/auto-login
# gated by mobilePoolAllowlist below); only the OIDC browser handlers resolve
# apps by host.
#
# delivery-portal (delivery.fe3dr.com) is deliberately absent — sunset; restore
# it alongside if that portal is revived.
products:
  - name: homechef
    domain: fe3dr.com
    apps:
      - name: web
        hosts: ["fe3dr.com", "www.fe3dr.com", "localhost:5173"]
        oauthClientId: "388815910560858918"
        sessionCookie: hc_session
        callbackPath: /auth/callback
        callbackHost: fe3dr.com
        postLoginUrl: /
        postLogoutUrl: /
        authContext: customer
        defaultRole: customer
        signInMethods: [password, google.com, apple.com, facebook.com, phone]
        allowedOrigins: ["https://fe3dr.com", "https://www.fe3dr.com", "http://localhost:5173"]

      - name: vendor-portal
        hosts: ["vendors.fe3dr.com", "localhost:5174"]
        oauthClientId: "388815909336122150"
        sessionCookie: hc_vendor_session
        callbackPath: /auth/callback
        postLoginUrl: /dashboard
        authContext: business
        # "chef", not "vendor": the Go API's UserRole enum has no vendor member
        # and every /chef/* route is gated by RequireChef() — role=vendor would
        # authenticate then 403 on the dashboard.
        defaultRole: chef
        signInMethods: [password, google.com, apple.com, phone]
        allowedOrigins: ["https://vendors.fe3dr.com", "http://localhost:5174"]

      - name: admin-portal
        hosts: ["admin.fe3dr.com", "localhost:5176"]
        oauthClientId: "388815911282279206"
        sessionCookie: hc_admin_session
        callbackPath: /auth/callback
        postLoginUrl: /
        authContext: internal
        defaultRole: admin
        signInMethods: [password, google.com]
        allowedEmailsEnv: HOMECHEF_ADMIN_ALLOWED_EMAILS
        allowedOrigins: ["https://admin.fe3dr.com", "http://localhost:5176"]

mobilePoolAllowlist:
  - customer
  - business
  # Internal/admin pool — powers the admin mobile app (apps/mobile-admin).
  # "internal" resolves to role=admin in autologin (defaultRoleForPool), still
  # gated by the HOMECHEF_ADMIN_ALLOWED_EMAILS allowlist + verified email.
  - internal
