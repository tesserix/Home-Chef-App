name: HomeChef Web - CI Build

# ──────────────────────────────────────────────────────────────────────────────
# Builds and publishes apps/web (the customer SPA) as homechef-web-app.
#
# PRs build-validate only — the app accumulated four TS errors while nothing
# built it. Pushes to main publish main-<sha7>, which is what Kargo's prod
# Stage promotes.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Force an image push even when this run wasn't triggered by a push to main (main pushes already publish)."
        type: boolean
        default: false
  # Publishes homechef-web-app on every main commit that touches the SPA.
  #
  # This was disabled while apps/web and the marketing landing both published
  # to the SAME image name (homechef-web) — the landing builds automatically,
  # so it always won that tag and the SPA could never ship. The SPA now has its
  # own image (homechef-web-app), so the collision is gone and it can publish
  # like every other service.
  #
  # It must publish on main for Kargo: the homechef Warehouse promotes from the
  # git commit graph and the prod Stage derives image.tag = main-<sha7>, so an
  # image has to exist at that tag for every promoted commit. ensure-image-tags
  # carries unchanged services forward, but a CHANGED service has to actually
  # build — otherwise the deploy branch advances to a tag that cannot be pulled.
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/homechef-web-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/homechef-web-build.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  # homechef-web-app, NOT homechef-web: the landing
  # (homechef-web-landing-build.yml) publishes to homechef-web and runs
  # automatically on every push to main, so it always won that tag and this
  # SPA could never actually ship. Separate images let both serve fe3dr.com,
  # split by path in manifests/homechef-istio/virtualservice.yaml.
  IMAGE_NAME: tesserix/home-chef-app/homechef-web-app

jobs:
  build:
    name: Build and Push HomeChef Web
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and Push to GHCR ---
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only emit `main-<sha7>` on main. No `:latest` — Kargo
          # promotes the newest matching tag from the GAR mirror via
          # the kargo-homechef Project's prod Stage.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # {{branch}} is empty on pull_request, which yields the invalid tag
            # ":-<sha>" and fails the build outright — so the branch-prefixed
            # sha tag is push-only. PRs get pr-<number>, which is valid and is
            # never pushed anyway (see the deploy gate on the build step).
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=homechef-web-app
            org.opencontainers.image.description=HomeChef Web Application

      - name: Compute cache ref
        id: cache
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          # Publish on a main push (the Kargo path) or an explicit deploy
          # dispatch. PR runs build-validate only and never push.
          push: ${{ github.event_name == 'push' || inputs.deploy == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://fe3dr.com/api/v1' }}
            VITE_BFF_URL=${{ vars.VITE_BFF_URL }}
            VITE_GIP_API_KEY=${{ secrets.GIP_WEB_API_KEY }}
            VITE_GIP_PROJECT_ID=tesseracthub-480811
            VITE_GIP_AUTH_DOMAIN=tesseracthub-480811.firebaseapp.com
            VITE_GIP_TENANT_ID=HomeChef-Customer-rqg8a
            VITE_GOOGLE_CLIENT_ID=849928263410-gri0fclh2pdbkgu3g3ppm6npa3kktib9.apps.googleusercontent.com
            VITE_OPENPANEL_CLIENT_ID=${{ vars.OPENPANEL_HOMECHEF_CLIENT_ID }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          # The GHCR login step above is skipped on pull_request, so the
          # registry cache has no credentials there: cache-from 401s and
          # cache-to 403s, failing a build that never pushes an image anyway.
          # Gate the cache on the same condition as the login so a PR
          # build-validates cleanly (uncached, which is fine — it is a
          # correctness check, not a release).
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}', steps.cache.outputs.ref) || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.cache.outputs.ref) || '' }}

      # Image push only — deployment is handled by Kargo via the git commit
      # graph: the `homechef-ensure-image-tags` workflow guarantees every
      # service image carries a main-<sha> tag for the commit and then
      # fast-forwards the `deploy` branch, which the kargo-homechef prod Stage
      # promotes by writing image.tag = main-<sha7> into the ArgoCD apps.

      # --- Security scanning (gated: fails the build on CRITICAL+HIGH) ---
      - name: Run Trivy vulnerability scanner
        id: trivy
        # Scans the pushed image by digest, so only when we actually pushed.
        if: github.event_name == 'push' || inputs.deploy == true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security tab
        if: always() && (github.event_name == 'push' || inputs.deploy == true)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:** HomeChef Web" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** AMD64" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "**Docker Image:** Pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
            echo "**Deploy:** Kargo promotes via the deploy branch (homechef-ensure-image-tags)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "**Docker Image:** Built successfully (not pushed)" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Run Tests
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure npm for GitHub Packages
        run: |
          echo "@tesserix:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: apps/web
        run: pnpm lint

      - name: Run type check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Run tests
        working-directory: apps/web
        run: pnpm test -- --passWithNoTests

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:** HomeChef Web" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Tests completed" >> $GITHUB_STEP_SUMMARY
