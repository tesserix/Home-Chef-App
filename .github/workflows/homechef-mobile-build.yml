name: HomeChef Mobile - EAS Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Mobile app(s) to build
        type: choice
        options: [all, customer, vendor, delivery, admin]
        default: all
      platform:
        description: Target platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: Submit the completed build to the configured store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-eas-${{ inputs.app }}-${{ inputs.platform }}-${{ inputs.profile }}-${{ inputs.submit }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (mobile-${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'all' && fromJSON('["customer","vendor","delivery","admin"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    uses: tesserix/tesserix-workflows/.github/workflows/expo-eas-build.yml@v2.2.1
    with:
      working_directory: apps/mobile-${{ matrix.app }}
      install_directory: .
      lockfile_path: pnpm-lock.yaml
      node_version: "22"
      package_manager: pnpm
      pnpm_version: 9.15.1
      workspace_filter: "@homechef/mobile-${{ matrix.app }}..."
      platform: ${{ inputs.platform }}
      profile: ${{ inputs.profile }}
      no_wait: true
      auto_submit: ${{ inputs.submit }}
    secrets:
      expo_token: ${{ secrets.EXPO_TOKEN }}
      package_read_token: ${{ secrets.NPM_TOKEN }}
