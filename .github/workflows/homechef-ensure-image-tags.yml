name: HomeChef - Ensure Image Tags & Advance Deploy

# Kargo's homechef Warehouse promotes via the GIT COMMIT GRAPH: it watches the
# `deploy` branch of this repo and the prod Stage derives image.tag =
# main-<sha7> for ALL five services (api, web, vendor-portal,
# delivery-portal, auth-bff). This replaced image-tag discovery, which broke
# because the homechef-* repos have >100 main-<sha> tags and Artifact Registry
# paginates the tag list at 100 (NewestBuild then promoted a stale page and
# flapped prod backwards). See tesserix/kargo-manifests homechef warehouse.
#
# Because CI is path-filtered, a commit only rebuilds the services whose
# sources changed. This workflow therefore GUARANTEES every service image
# carries a `main-<sha>` tag for the commit BEFORE advancing `deploy`:
#   * changed + buildable (api, auth-bff, web<-web-landing, web-app, and now
#     vendor-portal): wait for the service's own build workflow to push
#     main-<sha>.
#   * unchanged / non-built (delivery-portal, which still has no
#     push-triggered build workflow): re-tag the image carried by the previous
#     deploy commit (main-<prev sha7>) forward to main-<sha>. On first run (no
#     deploy branch yet) bootstrap that source from each service's
#     currently-deployed tag in tesserix-k8s.
#
# Carrying a service forward while its build is genuinely running is NOT
# harmless: this job would tag the old image as main-<sha>, the build would
# then re-point that tag, and the GAR pull-through caches tag->digest — so the
# cluster keeps pulling the carried-forward digest until the cached tag is
# purged by hand. Hence POLL must be true for every service that really builds.
# Only once all six tags exist is `deploy` fast-forwarded, so Kargo never
# promotes a commit whose images aren't all pullable — which also prevents the
# GAR pull-through mirror from negative-caching a 404 for a not-yet-pushed tag.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/homechef-ensure-image-tags.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # fast-forward the deploy branch
  packages: write   # re-tag images in GHCR

concurrency:
  group: homechef-ensure-image-tags
  # Newest commit wins. This was `false`, which wedged the whole pipeline: with
  # one slot in the queue, a run stuck polling for an image that never arrives
  # holds the lock, and GitHub cancels each PENDING run as the next one is
  # queued behind it. Every commit merged during that window silently never
  # advanced `deploy`, so Kargo never saw new freight and prod stayed pinned —
  # with nothing failing anywhere to say so.
  #
  # Cancelling in progress is safe here because the run is idempotent and only
  # ever fast-forwards `deploy` to its own commit: a newer run's commit is a
  # descendant, so it carries everything the cancelled one would have shipped.
  # The ancestry guard before the push still rejects genuinely out-of-order runs.
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: tesserix/home-chef-app
  K8S_REPO: tesserix/tesserix-k8s
  POLL_TIMEOUT_SECS: '2400'   # 40 min max wait for an in-flight build
  POLL_INTERVAL_SECS: '30'

jobs:
  ensure-tags:
    name: Ensure all six image tags, advance deploy
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Hard ceiling, slightly above POLL_TIMEOUT_SECS so a legitimate 40-minute
    # wait still completes. Without this the job's only bound was the runner's
    # 6-hour default, and a wedged run holds the concurrency lock for that whole
    # time — blocking every deploy behind it.
    timeout-minutes: 45
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history for the deploy fast-forward ancestry check

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Install crane
        run: |
          set -euo pipefail
          VERSION=v0.20.2
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Determine changed services
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          # On manual dispatch or an unknown 'before' (e.g. first push), treat
          # nothing as changed — every service carries forward. Safe: the
          # workflow then never falsely waits for a build that isn't happening.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FILES=""
          else
            FILES="$(git diff --name-only "${BEFORE}" "${{ github.sha }}")"
          fi
          echo "Changed files:"; echo "${FILES:-<none>}"
          changed() { printf '%s\n' "${FILES}" | grep -q "^$1" && echo true || echo false; }
          # True if ANY of the given prefixes changed. Each service's prefix list
          # MUST mirror its own build workflow's `push.paths`, because that is
          # what decides whether a build is actually running for this commit:
          #
          # Every list must also include that service's OWN build workflow file,
          # which is in its push.paths — a workflow-only edit really does rebuild
          # and republish the service.
          #
          # Under-detecting is the dangerous direction: a lockfile-only commit
          # rebuilds web-app and vendor-portal, and calling them "unchanged"
          # carries a stale image forward under this commit's tag while that
          # build is mid-flight. Over-detecting is merely slow — it waits for a
          # build that never comes and eventually times out without advancing
          # deploy — so never list a path the service's build does not trigger on.
          changed_any() {
            local p
            for p in "$@"; do
              printf '%s\n' "${FILES}" | grep -q "^${p}" && { echo true; return; }
            done
            echo false
          }
          # Each list mirrors that service's build workflow push.paths EXACTLY,
          # including the build workflow's own file — editing a build workflow
          # triggers that build, and omitting the path here made this job carry a
          # stale image forward while the build was mid-flight. (Observed on
          # 6e7cced: a workflow-only commit rebuilt vendor-portal, this job
          # carried it forward anyway, and the build then re-pointed the tag.)
          {
            echo "api=$(changed_any 'apps/api/' '.github/workflows/homechef-api-build.yml')"
            echo "auth_bff=$(changed_any 'apps/auth-bff/' '.github/workflows/homechef-auth-bff-build.yml')"
            echo "web=$(changed_any 'apps/web-landing/' 'pnpm-lock.yaml' '.github/workflows/homechef-web-landing-build.yml')"
            # homechef-web is the marketing landing; the customer SPA publishes
            # separately as homechef-web-app. '^apps/web/' needs the trailing
            # slash so it doesn't also match apps/web-landing/.
            echo "web_app=$(changed_any 'apps/web/' 'packages/' 'pnpm-lock.yaml' '.github/workflows/homechef-web-build.yml')"
            echo "vendor_portal=$(changed_any 'apps/vendor-portal/' 'packages/' 'pnpm-lock.yaml' '.github/workflows/homechef-vendor-portal-build.yml')"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure tags + advance deploy
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          K8S_TOKEN: ${{ secrets.TESSERIX_K8S_BOT }}
          API_CHANGED: ${{ steps.changed.outputs.api }}
          AUTHBFF_CHANGED: ${{ steps.changed.outputs.auth_bff }}
          WEB_CHANGED: ${{ steps.changed.outputs.web }}
          WEB_APP_CHANGED: ${{ steps.changed.outputs.web_app }}
          VENDOR_PORTAL_CHANGED: ${{ steps.changed.outputs.vendor_portal }}
        run: |
          set -euo pipefail
          NEW_TAG="main-${SHORT_SHA}"
          REG="${REGISTRY}/${IMAGE_PREFIX}"

          # buildable&changed? delivery-portal still has no push-triggered build
          # workflow -> always carry forward.
          #
          # vendor-portal DOES build on main now. Leaving it "false" here would
          # be actively harmful: this job would carry the previous image forward
          # under NEW_TAG while the real build was still running, the build would
          # then re-point that same tag, and the GAR pull-through — which caches
          # tag->digest — would keep serving the carried-forward digest. That is
          # exactly the failure that had prod running a stale vendor-portal.
          declare -A POLL=(
            [homechef-api]="${API_CHANGED}"
            [homechef-auth-bff]="${AUTHBFF_CHANGED}"
            [homechef-web]="${WEB_CHANGED}"
            [homechef-web-app]="${WEB_APP_CHANGED}"
            [homechef-vendor-portal]="${VENDOR_PORTAL_CHANGED}"
            [homechef-delivery-portal]="false"
          )
          # tesserix-k8s ArgoCD app file -> used ONLY to bootstrap the
          # carry-forward source on the very first run (no deploy branch yet).
          declare -A APPFILE=(
            [homechef-api]="argocd/prod/apps/homechef/homechef-api.yaml"
            [homechef-auth-bff]="argocd/prod/apps/homechef/homechef-auth-bff.yaml"
            [homechef-web]="argocd/prod/apps/homechef/homechef-web.yaml"
            [homechef-web-app]="argocd/prod/apps/homechef/homechef-web-app.yaml"
            [homechef-vendor-portal]="argocd/prod/apps/homechef/homechef-vendor-portal.yaml"
            [homechef-delivery-portal]="argocd/prod/apps/homechef/homechef-delivery-portal.yaml"
          )

          tag_exists() { crane manifest "${REG}/$1:${NEW_TAG}" >/dev/null 2>&1; }

          # ONE deadline for the whole job, not one per service.
          #
          # The per-service `elapsed` counter this replaces reset on every
          # iteration, so a commit touching four buildable services could wait
          # 4 x POLL_TIMEOUT_SECS — over two hours — while holding the
          # concurrency lock and blocking every later deploy.
          POLL_DEADLINE=$(( $(date +%s) + POLL_TIMEOUT_SECS ))

          # Carry-forward source for an UNCHANGED service is resolved PER SERVICE
          # from THIS commit's own history (find_carry_source), NOT the deploy
          # branch tip. Deriving it from `deploy` silently ships a stale image
          # whenever that branch lags behind main — e.g. several PRs merged in
          # quick succession, where the concurrency group keeps only the newest
          # *pending* advance-deploy run (GitHub cancels earlier pending ones even
          # with cancel-in-progress:false), so `deploy` never caught up. If the
          # HEAD commit is then frontend-only, an unchanged backend service gets
          # carried forward from the stale deploy tip and prod runs old code.
          # Walking HEAD's history instead always finds the newest actually-built
          # image for the service.
          git fetch origin deploy --quiet 2>/dev/null || true

          find_carry_source() {
            # Newest commit on HEAD's history whose main-<sha7> image tag already
            # exists in the registry for this service. Returns 1 (empty) if none
            # found within the lookback window; caller falls back to bootstrap.
            local svc="$1" sha tag
            for sha in $(git rev-list --max-count=50 "${{ github.sha }}"); do
              tag="main-$(printf '%s' "${sha}" | cut -c1-7)"
              if crane manifest "${REG}/${svc}:${tag}" >/dev/null 2>&1; then
                printf '%s' "${tag}"; return 0
              fi
            done
            return 1
          }

          bootstrap_tag() {
            # read image.tag value from a service's ArgoCD app yaml on tesserix-k8s main
            curl -sS -H "Authorization: Bearer ${K8S_TOKEN}" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${K8S_REPO}/contents/$1?ref=main" \
              | grep -A1 'name: image.tag' | grep 'value:' | head -1 \
              | sed -E 's/.*value:[[:space:]]*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]'
          }

          for SVC in homechef-api homechef-auth-bff homechef-web homechef-web-app homechef-vendor-portal homechef-delivery-portal; do
            echo "::group::${SVC}"
            if tag_exists "${SVC}"; then
              echo "${SVC}:${NEW_TAG} already present ✓"; echo "::endgroup::"; continue
            fi
            if [ "${POLL[$SVC]}" = "true" ]; then
              remaining=$(( POLL_DEADLINE - $(date +%s) ))
              echo "changed+buildable — waiting up to ${remaining}s (shared budget) for the build to push ${NEW_TAG}…"
              until tag_exists "${SVC}"; do
                if [ "$(date +%s)" -ge "${POLL_DEADLINE}" ]; then
                  echo "TIMEOUT waiting for ${SVC}:${NEW_TAG}; NOT advancing deploy (prod stays on last good)." >&2
                  echo "::endgroup::"; exit 1
                fi
                sleep "${POLL_INTERVAL_SECS}"
              done
              echo "${SVC}:${NEW_TAG} appeared ✓"
            else
              SRC="$(find_carry_source "${SVC}")" || SRC=""
              if [ -z "${SRC}" ]; then
                SRC="$(bootstrap_tag "${APPFILE[$SVC]}")"
              fi
              if [ -z "${SRC}" ]; then
                echo "Could not resolve a carry-forward source for ${SVC}." >&2
                echo "::endgroup::"; exit 1
              fi
              echo "carry forward ${SVC}:${SRC} -> ${NEW_TAG}"
              crane tag "${REG}/${SVC}:${SRC}" "${NEW_TAG}"
            fi
            echo "::endgroup::"
          done

          echo "All six images carry ${NEW_TAG}. Advancing deploy…"
          if git rev-parse --verify -q origin/deploy >/dev/null; then
            if ! git merge-base --is-ancestor origin/deploy "${{ github.sha }}"; then
              echo "origin/deploy is not an ancestor of ${{ github.sha }} (out-of-order run); skipping fast-forward."
              exit 0
            fi
          fi
          git push origin "${{ github.sha }}:refs/heads/deploy"
          echo "deploy -> ${{ github.sha }} (${NEW_TAG})"

      - name: Summary
        if: always()
        run: |
          echo "## Ensure Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** main-${{ steps.sha.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deploy branch:** fast-forwarded once all six images carry the tag" >> "$GITHUB_STEP_SUMMARY"
